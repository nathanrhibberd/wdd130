<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&family=Russo+One&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <h1>WDD 130 | HTML Form - User Poll</h1>
    <form>
        <section class="contactinfo">
            <h2>Contact Information</h2>
            <div class="form-item column2">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="form-item column2">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" placeholder="email@web.com"
                  required>
            </div>
        </section>
        <section class="questions">
            <h2>Questions</h2>
            <div class="form-item column1">
                <label for="browser">What is your favorite browser?</label>
                <select name="browser" id="browser">
                    <option value="1">Chrome</option>
                    <option value="2">Edge</option>
                    <option value="3">Bing</option>
                    <option value="4">Firefox</option>
                    <option value="5">Opera</option>
                    <option value="6">Other</option>
                </select>
            </div>
            <div class="form-item column1">
                <label for="haspet" id="haspet">Do you have a household pet?</label>
                <input type="checkbox" id="haspet" name="haspet">
                <label for="feedback">List the places you have lived:</label>
                <textarea id="feedback" name="feedback" rows="4"
                  placeholder="Town/City, State, Country"></textarea>
            </div>
            <button type="submit">Submit Poll</button>
        </section>
    </form>
    <footer>
        <p>©2026 | Nathan Ray Hibberd | Arizona, USA</p>
    </footer>
</body>

</html>
