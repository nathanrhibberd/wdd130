<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fictional Rafting Company | Contact Us</title>
    <meta name="description"
      content="Fictional Rafting Company is exactly that - a fictional rafting company. We ensure that all of your fictional rafting needs are met!">
    <meta name="author" content="Nathan R. Hibberd">
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <nav class="toppage">
            <img class="navlogo" src="images/logo.webp" alt="Fictional Rafting Company">
            <ul>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contact">
            <h1>Fictional Rafting Company</h1>
            <article>
                <p>123 W Thisisnta Street</p>
                <p>Town, State</p>
                <p>+1 999 999 9999</p>
                <p>fakeemail@fictionalrafting.com</p>
            </article>
        </div>
        <section>
            <div class="grid">
                <form>
                    <div class="message-info">
                        <div class="message-item">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="First, Last"
                              required>
                        </div>
                        <div class="message-item">
                            <label for="user-email">Email</label>
                            <input type="email" id="user-email" name="user-email"
                              placeholder="adress@email.com" required>
                        </div>
                        <div class="message-item">
                            <legend>Message Purpose</legend>
                            <div class="radio">
                                <label class="radio-item">
                                    <input type="radio" id="geninq" name="purpose" />

                                    <span class="radio-label">General Inquiry</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" id="resque" name="purpose" />
                                    <span class="radio-label">Reservation Question</label>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" id="websug" name="purpose" />
                                    <span class="radio-label">Website Suggestion</label>
                                </label>
                            </div>
                        </div>
                        <div class="message-item">
                            <label for="message-text">Message
                                <textarea type="text" id="message-text" name="message-text"
                                  required>Type Here</textarea></label>
                        </div>
                    </div>
                    <div class="message-item check">
                        <input type="checkbox" id="subsc" name="subsc">
                        <label for="checkbox">Please Subscribe me to
                            the monthly newsletter</label>
                    </div>
                    <button>Get in Touch!</button>
                </form>
                <aside>
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d13047.582349961402!2d-98.45260138601338!3d35.159224662343505!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x87adb30af7b76acb%3A0xae2aac995c0e1ebe!2sNowhere%2C%20OK%2073038!5e0!3m2!1sen!2sus!4v1785618188613!5m2!1sen!2sus"
                      allowfullscreen="" loading="lazy" height="350px" width="350px"
                      referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </aside>
            </div>
        </section>
        <div class="employees">
            <h2>We Are Here To Serve You</h2>
            <ul>
                <figure>
                    <img src="images/employee1.jpg" alt="John Rafterson">
                    <figcaption>John Rafterson</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Rebecca Rapids">
                    <figcaption>Rebecca Rapids</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="River Watterfield">
                    <figcaption>River Watterfield</figcaption>
                </figure>
            </ul>
        </div>
    </main>

    <footer>
        <p>©2026 | Fictional Companies | Nathan Ray Hibberd</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-bw.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-bw.svg" alt="Instagram Icon">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube-bw.svg" alt="YouTube Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
